upstream goldshop_api { server app:4000; keepalive 32; }
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  client_max_body_size 50m;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://goldshop_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
  location /socket.io/ {
    proxy_pass http://goldshop_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
  location = /panel { return 301 /panel/; }
  location /panel/ { try_files $uri $uri/ /panel/index.html; }
  location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ { expires 30d; try_files $uri =404; }
  location ~* \.(?:css|js)$ { expires -1; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { try_files $uri $uri/ =404; }
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
